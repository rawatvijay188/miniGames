<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Reels</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="machine" aria-label="Neon Reels slot game">
        <header class="topbar">
          <div>
            <p class="kicker">Arcade slots</p>
            <h1>Neon Reels</h1>
          </div>
          <button class="icon-button" id="soundToggle" type="button" aria-label="Toggle sound" title="Toggle sound">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z"></path>
              <path d="M16 8c1.5 1 2.2 2.3 2.2 4S17.5 15 16 16"></path>
              <path d="M18.5 5.5c2.4 1.8 3.5 4 3.5 6.5s-1.1 4.7-3.5 6.5"></path>
            </svg>
          </button>
        </header>

        <section class="meters" aria-label="Game totals">
          <div class="meter">
            <span>Balance</span>
            <strong id="balance">$500</strong>
          </div>
          <div class="meter">
            <span>Bet</span>
            <strong id="bet">$25</strong>
          </div>
          <div class="meter">
            <span>Last Win</span>
            <strong id="lastWin">$0</strong>
          </div>
        </section>

        <section class="reel-window" aria-live="polite">
          <div class="payline" aria-hidden="true"></div>
          <div class="reels" id="reels"></div>
          <div class="win-banner" id="winBanner" role="status">Ready</div>
        </section>

        <section class="controls" aria-label="Slot controls">
          <button class="stepper" id="betDown" type="button" aria-label="Decrease bet" title="Decrease bet">-</button>
          <input id="betSlider" type="range" min="5" max="100" step="5" value="25" aria-label="Bet amount">
          <button class="stepper" id="betUp" type="button" aria-label="Increase bet" title="Increase bet">+</button>
          <button class="spin-button" id="spinButton" type="button">Spin</button>
        </section>

        <section class="paytable" aria-label="Paytable">
          <div><span>3 Wilds</span><strong>10x</strong></div>
          <div><span>3 Sevens</span><strong>8x</strong></div>
          <div><span>3 Gems</span><strong>6x</strong></div>
          <div><span>Any pair</span><strong>2x</strong></div>
        </section>

        <section class="test-panel" aria-label="Test outcomes">
          <span>Test Spin</span>
          <button type="button" data-force="wild,wild,wild">Wilds</button>
          <button type="button" data-force="seven,seven,seven">Sevens</button>
          <button type="button" data-force="gem,gem,gem">Gems</button>
          <button type="button" data-force="cherry,cherry,bell">Pair</button>
          <button type="button" data-force="cherry,bell,gem">No Win</button>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
