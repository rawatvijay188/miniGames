<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dice Duel | Game Hub</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="mini-game" aria-label="Dice Duel game">
        <nav class="game-nav" aria-label="Game navigation">
          <a href="../index.html">All games</a>
        </nav>

        <header class="mini-header">
          <p class="kicker">Quick chance</p>
          <h1>Dice Duel</h1>
        </header>

        <section class="score-strip" aria-label="Score">
          <div><span>Balance</span><strong id="diceBalance">$300</strong></div>
          <div><span>Bet</span><strong id="diceBet">$20</strong></div>
          <div><span>Result</span><strong id="diceResult">Ready</strong></div>
        </section>

        <section class="duel-table" aria-live="polite">
          <div class="dice-side">
            <span>You</span>
            <div class="dice-row" id="playerDice">
              <b>⚀</b>
              <b>⚀</b>
            </div>
          </div>
          <div class="versus">VS</div>
          <div class="dice-side">
            <span>Dealer</span>
            <div class="dice-row" id="dealerDice">
              <b>⚀</b>
              <b>⚀</b>
            </div>
          </div>
        </section>

        <section class="mini-controls" aria-label="Dice controls">
          <button class="stepper" id="diceBetDown" type="button" aria-label="Decrease bet">-</button>
          <input id="diceBetSlider" type="range" min="10" max="100" step="10" value="20" aria-label="Bet amount">
          <button class="stepper" id="diceBetUp" type="button" aria-label="Increase bet">+</button>
          <button class="spin-button" id="rollButton" type="button">Roll</button>
        </section>
      </section>
    </main>

    <script src="../js/dice-duel.js"></script>
  </body>
</html>
