<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number Rush | Game Hub</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="mini-game" aria-label="Number Rush game">
        <nav class="game-nav" aria-label="Game navigation">
          <a href="../index.html">All games</a>
        </nav>

        <header class="mini-header">
          <p class="kicker">Puzzle run</p>
          <h1>Number Rush</h1>
        </header>

        <section class="score-strip" aria-label="Round status">
          <div><span>Range</span><strong id="rangeLabel">1-50</strong></div>
          <div><span>Attempts</span><strong id="attempts">6</strong></div>
          <div><span>Streak</span><strong id="streak">0</strong></div>
        </section>

        <section class="range-editor" aria-label="Number range">
          <label>
            <span>Min</span>
            <input id="minRange" type="number" min="1" max="999" value="1" aria-label="Minimum number">
          </label>
          <label>
            <span>Max</span>
            <input id="maxRange" type="number" min="2" max="1000" value="50" aria-label="Maximum number">
          </label>
        </section>

        <section class="number-stage" aria-live="polite">
          <div class="mystery-number" id="mysteryNumber">?</div>
          <p id="numberMessage">Find the hidden number.</p>
        </section>

        <form class="guess-form" id="guessForm">
          <input id="guessInput" type="number" min="1" max="50" placeholder="Enter a number" aria-label="Your guess" required>
          <button class="spin-button" type="submit">Guess</button>
          <button class="stepper reset-button" id="resetNumber" type="button" aria-label="New round" title="New round">↻</button>
        </form>
      </section>
    </main>

    <script src="../js/number-rush.js"></script>
  </body>
</html>
