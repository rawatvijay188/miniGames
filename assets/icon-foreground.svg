<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Neon 2x2 "mini games" grid. Kept inside the central adaptive-icon safe
       zone so it survives circular / squircle masking on Android. -->
